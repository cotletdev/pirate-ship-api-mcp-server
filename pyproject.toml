[project]
name = "pirate-ship-api-mcp"
version = "1.0.5"
description = "Self-hosted Pirate Ship API and MCP server on your own Chrome session. Use Pirate Ship from Claude, Cursor, Codex or any MCP client or AI agent."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
requires-python = ">=3.11"
authors = [{ name = "Cotlet", email = "contact@cotlet.dev" }]
keywords = ["pirate ship", "pirate ship api", "pirate ship mcp", "usps", "ups", "shipping labels", "mcp server", "claude", "cursor"]
dependencies = [
    "curl_cffi>=0.13,<0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
    "websockets>=13",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://cotlet.dev/integrations/pirate-ship-api-mcp-server"
Source = "https://github.com/cotletdev/pirate-ship-api-mcp-server"

[project.scripts]
pirate-ship-mcp = "pirate_ship_api_mcp.cli:main"
pirate-ship-api-mcp = "pirate_ship_api_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pirate_ship_api_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
